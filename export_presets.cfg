; Export presets for Jailbreak.
;
; The one setting that matters and is easy to miss: include_filter must contain
; *.json. Godot does not treat .json as a resource, so without that line the
; whole of data/ is silently left out of the build and the game starts with no
; content. scripts/main.gd detects that case and says so on screen rather than
; failing mysteriously, but the fix is here.
;
; Godot fills in any option it does not find below with its own default the
; first time you open Project > Export.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tools/*, docs/*, plan.md"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
